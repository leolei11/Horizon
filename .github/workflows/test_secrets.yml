name: Test Secrets
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Secret
        env:
          SF_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          if [ -z "$SF_KEY" ]; then
            echo "Secret is empty"
          else
            echo "Secret is set: ${SF_KEY:0:5}..."
          fi
